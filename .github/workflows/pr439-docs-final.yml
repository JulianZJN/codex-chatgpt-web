name: PR 439 final documentation

on:
  push:
    branches:
      - tmp/pr439-docs-final-20260911
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr439-docs-final
  cancel-in-progress: false

jobs:
  align-verify-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply documentation alignment to the PR branch
        shell: bash
        run: |
          set -euo pipefail
          cp .github/pr439_docs_final.py /tmp/pr439_docs_final.py
          git fetch origin feat/pro-model-version-selection
          git checkout -B feat/pro-model-version-selection origin/feat/pro-model-version-selection
          test "$(git rev-parse HEAD)" = "039c385f09ba43eac398259eb6360ffe02ede75e"
          git remote add upstream https://github.com/miuuyy/codex-chatgpt-web.git || true
          git fetch upstream main
          git rebase upstream/main
          python3 /tmp/pr439_docs_final.py
          git diff --check
          test "$(git diff --name-only | sort)" = $'README.ja.md\nREADME.md\nREADME.zh-CN.md\ndocs/pro-model-selection.md'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run focused model tests
        run: bun test tests/pro-model-selection.test.ts tests/model-contract.test.ts

      - name: Run full root test suite
        run: bun test ./tests

      - name: Run typecheck
        run: bun run typecheck

      - name: Publish one verified feature commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | sort)" = $'README.ja.md\nREADME.md\nREADME.zh-CN.md\ndocs/pro-model-selection.md'
          git config user.name "JulianZJN"
          git config user.email "JulianZJN@users.noreply.github.com"
          git add README.md README.zh-CN.md README.ja.md docs/pro-model-selection.md
          git diff --cached --check
          git commit --amend --no-edit
          git push --force-with-lease origin HEAD:feat/pro-model-version-selection
